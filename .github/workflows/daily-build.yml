name: Daily Build

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual triggering

# Ensure only one daily build runs at a time and cancel outdated runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Set maximum job runtime
    permissions:
      contents: read
      security-events: write # For security scanning
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1 # Shallow clone for faster checkout
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'yarn'
        cache-dependency-path: 'yarn.lock'
    
    - name: Configure Ubuntu APT
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends apt-transport-https ca-certificates
        sudo rm -rf /var/lib/apt/lists/*
      continue-on-error: true
    
    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
    
    - name: Cache Yarn dependencies
      uses: actions/cache@v6
      id: yarn-cache
      with:
        path: |
          ${{ steps.yarn-cache-dir-path.outputs.dir }}
          .yarn/cache
          .yarn/install-state.gz
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
    
    - name: Install dependencies
      run: yarn install --frozen-lockfile --prefer-offline --network-timeout 100000
      timeout-minutes: 5
    
    - name: Security audit
      run: yarn audit --groups dependencies || echo "Security vulnerabilities found, continuing build"
      # Don't fail build on audit issues, just report them
      continue-on-error: true
    
    - name: Run tests
      run: yarn test --ci --json --outputFile=test-report.json
      timeout-minutes: 5
      
    - name: Publish Test Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: test-report.json
        retention-days: 7
    
    - name: Build with fresh API data
      run: yarn build:ci
      timeout-minutes: 5
      env:
        # Explicitly set production mode
        NODE_ENV: production
    
    - name: Cache build output
      uses: actions/cache@v6
      with:
        path: ./dist
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-
    
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: www
        path: dist
        retention-days: 7 # Only keep artifacts for 7 days to save storage
        if-no-files-found: error
    
    # podrapp.com is hosted on Cloudflare Pages (docs/CLOUDFLARE_PAGES.md).
    # Pages builds from Git, so the daily refresh asks it for a new production
    # build through a deploy hook instead of uploading dist/. The step is
    # skipped where the secret is not set, such as in forks.
    - name: Trigger Cloudflare Pages build
      id: pages-deploy
      env:
        CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
      run: |
        if [[ -z "$CLOUDFLARE_PAGES_DEPLOY_HOOK" ]]; then
          echo "No deploy hook configured; skipping."
          exit 0
        fi
        curl --fail --silent --show-error --output /dev/null \
          --retry 3 --max-time 30 -X POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
        echo "triggered=true" >> "$GITHUB_OUTPUT"
      timeout-minutes: 2

    - name: Create deployment summary
      if: always()
      env:
        PAGES_TRIGGERED: ${{ steps.pages-deploy.outputs.triggered }}
        PAGES_OUTCOME: ${{ steps.pages-deploy.outcome }}
      run: |
        echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
        if [[ "$PAGES_TRIGGERED" == "true" ]]; then
          echo "✅ Cloudflare Pages build triggered" >> $GITHUB_STEP_SUMMARY
        elif [[ "$PAGES_OUTCOME" == "success" ]]; then
          echo "⏭️ No Cloudflare Pages deploy hook configured; nothing was deployed" >> $GITHUB_STEP_SUMMARY
        elif [[ "$PAGES_OUTCOME" == "failure" ]]; then
          echo "❌ Cloudflare Pages deploy hook failed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Cloudflare Pages build not triggered: an earlier step failed" >> $GITHUB_STEP_SUMMARY
        fi
