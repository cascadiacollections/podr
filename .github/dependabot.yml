# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Each ecosystem is grouped into one PR and waits 7 days before proposing a new
# release. Security updates are raised by GitHub independently of this file and
# are neither grouped nor delayed by it.

version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/webpack-api-inliner-plugin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    assignees:
      - "KevinTCoughlin"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    groups:
      npm:
        patterns: ["*"]
    # ts-jest and typescript-eslint need the TypeScript 6 compiler API, which
    # TypeScript 7 (the native port) does not expose. Revisit when they support it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "America/Los_Angeles"
    assignees:
      - "KevinTCoughlin"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # The dev container uses an image reference in devcontainer.json (no
  # Dockerfile), which the docker ecosystem cannot read.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "11:00"
      timezone: "America/Los_Angeles"
    assignees:
      - "KevinTCoughlin"
    labels:
      - "dependencies"
    commit-message:
      prefix: "docker"
      include: "scope"
    open-pull-requests-limit: 2
    groups:
      devcontainers:
        patterns: ["*"]
    cooldown:
      default-days: 7
