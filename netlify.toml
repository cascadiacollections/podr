[build]
  # Install dependencies (including devDependencies needed for heft)
  command = "yarn install --production=false --frozen-lockfile && yarn build:ci"
  publish = "dist"
  # Skip build if only package publishing metadata changes (not affecting website runtime)
  # See scripts/netlify-ignore.sh for the logic:
  # - Skips: version bumps, CHANGELOG, README in packages/
  # - Builds: plugin runtime code changes (.ts/.js), website source changes
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  # Pin Node.js to match .nvmrc / .node-version and package.json engines, so
  # the project setting (defaulting to Node 20) never takes over
  NODE_VERSION = "24"
  # Build optimizations
  NODE_ENV = "production"
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Yarn configuration
  YARN_ENABLE_IMMUTABLE_INSTALLS = "false"
  # Analytics is opt-in per deployment and off by default (see
  # config/analytics.js). This site keeps Google Analytics; a self-hosted
  # deployment sets provider to umami/plausible/goatcounter instead, and must
  # allow that origin in the Content-Security-Policy below.
  PODR_ANALYTICS_PROVIDER = "gtag"
  PODR_ANALYTICS_SITE_ID = "G-19Z3SPSJPY"

# The Netlify site has @netlify/plugin-sitemap enabled in the UI. After the
# build it overwrites dist/sitemap.xml with a one-URL sitemap on the Netlify
# hostname (https://podr.netlify.app/). podr-sitemap.xml is the same document
# the build wrote, under a name that plugin does not touch. Forcing this
# rewrite makes /sitemap.xml that file. robots.txt points at /sitemap.xml.
# Self-hosted nginx and Caddy have no such plugin and serve dist/sitemap.xml.
[[redirects]]
  from = "/sitemap.xml"
  to = "/podr-sitemap.xml"
  status = 200
  force = true

# SPA fallback for client-side routes such as /privacy and /?feed=<podcast>.
# status 200 is a shadowing rewrite: Netlify serves a real file at that path
# instead, and this rule must not be forced. force = true would answer
# /robots.txt, /ads.txt, and /sitemap.xml with index.html. ads.txt is copied
# from assets/; robots.txt and both sitemap files are emitted by SitemapPlugin.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers. Self-hosted copies live in
# deploy/nginx/snippets/podr-security-headers.conf and deploy/caddy/Caddyfile, and
# config/__tests__/securityHeaders.test.js fails if they drift. Anything only this
# site needs (Google Analytics, the hosted API origin) must be declared there.
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy - Allow required external resources
    #   media-src: episode audio is served from whichever CDN a podcast uses, and
    #     without it playback falls back to default-src 'self' and is blocked
    #   connect-src: the podcast APIs, plus the Analytics collect endpoints
    #   script-src/img-src/connect-src/frame-src: Google AdSense, its ad vendors
    #     (doubleclick) and the Funding Choices consent prompt
    #   no cdn.jsdelivr.net: styles and fonts now ship with the bundle
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://adservice.google.com https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob: https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://adservice.google.com https://fundingchoicesmessages.google.com; font-src 'self'; media-src 'self' https: blob:; connect-src 'self' https://itunes.apple.com https://podr-service.cascadiacollections.workers.dev https://*.google-analytics.com https://*.analytics.google.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://adservice.google.com https://fundingchoicesmessages.google.com; manifest-src 'self'; worker-src 'self'; frame-src 'self' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://adservice.google.com https://fundingchoicesmessages.google.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    # Security headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    # Strict-Transport-Security (HSTS) - Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache static assets aggressively with content-based hashing
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.@(js|css|png|jpg|jpeg|webp|woff|woff2|ttf|eot|svg|ico|gif)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Manifest and service worker should be revalidated.
# Declared after the immutable rule above so it wins for these paths - a cached
# service worker would pin users to an old build.
[[headers]]
  for = "/@(manifest.json|site.webmanifest|sw.js|service-worker.js)"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ads.txt, robots.txt, and sitemap.xml are fetched by crawlers that expect
# the file itself, not the SPA shell. The unforced rewrite above already
# prefers these files when they exist in dist/; the types below keep a proxy
# from guessing.
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/podr-sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML should not be cached to ensure users get the latest version
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Inputs override the UI-installed sitemap plugin so it does not replace
# dist/sitemap.xml with a one-URL file on the Netlify hostname. The package is
# resolved from that UI install; this block only changes its inputs. The forced
# /sitemap.xml rewrite above still serves podr-sitemap.xml if the plugin runs
# with its old inputs.
[[plugins]]
  package = "@netlify/plugin-sitemap"

  [plugins.inputs]
  baseUrl = "https://podrapp.com"
  filePath = "netlify-plugin-sitemap.xml"
