# Podr security headers, mirroring the [[headers]] block in netlify.toml.
#
# nginx does not merge add_header directives across levels: a location block that
# adds any header of its own discards every add_header inherited from the server
# block. Because each cache tier below sets its own Cache-Control, this snippet
# has to be included in *every* location that does, not just once at server
# level. Keep that in mind when adding a location.
#
# Content-Security-Policy notes:
#   media-src   episode audio is served from whichever CDN a podcast uses, and
#               without it playback falls back to default-src 'self' and is blocked
#   connect-src the podcast APIs Podr talks to. Replace the workers.dev origin
#               with your own service host if you self-host the feed proxy.
#   script-src  'unsafe-inline' is required by the inlined top-podcasts payload
#               and the analytics snippet. No third-party analytics origin is
#               listed: a default build ships none. If you set
#               PODR_ANALYTICS_PROVIDER, add that origin to script-src and
#               connect-src (the build prints it).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self'; media-src 'self' https: blob:; connect-src 'self' https://api.rss2json.com https://itunes.apple.com https://podr-service.cascadiacollections.workers.dev; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

# HSTS. Only meaningful over TLS, and "preload" is a commitment: do not enable it
# on a host that may need to serve plain HTTP again.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
