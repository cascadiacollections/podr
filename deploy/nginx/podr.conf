# Podr served by nginx from a static build.
#
# Debian/Ubuntu:  /etc/nginx/sites-available/podr  (symlink into sites-enabled)
#                 snippets go in /etc/nginx/snippets/
# FreeBSD:        /usr/local/etc/nginx/podr.conf, included from nginx.conf
#                 snippets go in /usr/local/etc/nginx/snippets/
#
# The include paths below use /etc/nginx; on FreeBSD replace that prefix with
# /usr/local/etc/nginx.
#
# This is the Netlify configuration (netlify.toml) translated to nginx: the SPA
# fallback, the same security headers, and the same three cache tiers. See
# docs/SELF_HOSTING.md.
#
# gzip_static serves the .gz files webpack's CompressionPlugin already emitted
# instead of compressing on every request. It needs nginx built with
# ngx_http_gzip_static_module - check with:
#   nginx -V 2>&1 | grep -o with-http_gzip_static_module
# On Debian that means the nginx-full or nginx-extras package. If your build
# lacks it, delete the gzip_static lines; nothing else depends on them.

server {
    listen 80;
    listen [::]:80;
    server_name podr.example.org;

    # Certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name podr.example.org;

    ssl_certificate     /etc/letsencrypt/live/podr.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podr.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:podr_tls:10m;
    ssl_session_timeout 1d;

    # podr-deploy.sh swaps this symlink atomically, so a deploy never serves a
    # half-extracted release and nginx needs no reload.
    root /srv/podr/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/podr.access.log;
    error_log  /var/log/nginx/podr.error.log;

    # ---- Revalidated assets -------------------------------------------------
    # Declared as exact matches, which nginx prefers over the regex locations
    # below, so a cached service worker can never pin users to an old build.
    location = /sw.js {
        include /etc/nginx/snippets/podr-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /service-worker.js {
        include /etc/nginx/snippets/podr-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/podr-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        types { } default_type application/manifest+json;
    }

    location = /manifest.json {
        include /etc/nginx/snippets/podr-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        types { } default_type application/manifest+json;
    }

    # ---- Content-hashed assets ---------------------------------------------
    location /static/ {
        include /etc/nginx/snippets/podr-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|webp|woff|woff2|ttf|eot|svg|ico|gif)$ {
        include /etc/nginx/snippets/podr-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- HTML and the SPA fallback -----------------------------------------
    location / {
        include /etc/nginx/snippets/podr-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
