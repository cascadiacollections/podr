<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Podr | Listen to your favorite podcasts</title>
    <meta name="description" content="Podr is an open source podcast player for the web. Search podcasts, keep your favorites, and listen right in the browser.">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#faf8f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
    <meta property="og:title" content="Podr">
    <meta property="og:description" content="An open source podcast player for the web.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://podrapp.com">
    <meta property="og:image" content="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <!-- Artwork comes from Apple's CDN; warming the connection saves a round trip on the first grid -->
    <link rel="preconnect" href="https://is1-ssl.mzstatic.com" crossorigin>
    <!-- Styles ship inside the bundle: no third-party stylesheet blocks the first paint -->
    <!--
      Analytics is injected at build time from PODR_ANALYTICS_PROVIDER and is
      empty unless a deployment opts in, so a default build loads no analytics
      script at all. See config/analytics.js and docs/SELF_HOSTING.md.
    -->
    <% if (htmlWebpackPlugin.options.analyticsProvider === 'gtag') { %>
    <!--
      Google Consent Mode v2. Must run before the gtag config in the analytics
      snippet below: every storage type starts denied, and the consent prompt
      updates it once a visitor chooses. wait_for_update holds the first tags
      back briefly so the prompt can apply a stored choice.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
    </script>
    <!--
      TODO(ads): Google CMP (Funding Choices) consent prompt. Turn it on under
      AdSense > Privacy & messaging, then paste the script it gives here, ahead
      of the analytics snippet, e.g.
      <script async src="https://fundingchoicesmessages.google.com/i/pub-XXXXXXXXXXXXXXXX?ers=1"></script>
    -->
    <% } %>
    <%= htmlWebpackPlugin.options.analyticsSnippet || '' %>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
