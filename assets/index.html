<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Podr | Listen to your favorite podcasts</title>
    <meta name="description" content="Podr is a free, open source podcast player for the web. Search podcasts, star your favorites to keep them offline, and listen right in the browser.">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#faf8f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
    <!--
      Canonical URL. The page is a single-page app: / and /privacy, and every
      podcast page (/?feed=<url>, listed in sitemap.xml) is served from this
      one file, so a static <link rel="canonical"> would fold them all into the
      home page. This keeps the path and the feed parameter, drops anything
      else (utm_* and the like), and moves the host to the site origin, so
      podr.netlify.app points at podrapp.com.
    -->
    <script>
      (function () {
        var here = new URL(location.href);
        var canonical = new URL(here.pathname, <%= JSON.stringify(htmlWebpackPlugin.options.siteOrigin) %>);
        var feed = here.searchParams.get('feed');
        if (feed) canonical.searchParams.set('feed', feed);
        var link = document.createElement('link');
        link.rel = 'canonical';
        link.href = canonical.href;
        document.head.appendChild(link);
      })();
    </script>
    <meta property="og:site_name" content="Podr">
    <meta property="og:title" content="Podr: an open source podcast player for the web">
    <meta property="og:description" content="Search podcasts, star your favorites, and listen right in the browser. Free and MIT licensed.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="<%= htmlWebpackPlugin.options.siteOrigin %>/">
    <meta property="og:image" content="<%= htmlWebpackPlugin.options.siteOrigin %>/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Podr, an open source podcast player for the web: search podcasts, keep your favorites, listen in the browser.">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Podr: an open source podcast player for the web">
    <meta name="twitter:description" content="Search podcasts, star your favorites, and listen right in the browser. Free and MIT licensed.">
    <meta name="twitter:image" content="<%= htmlWebpackPlugin.options.siteOrigin %>/og-image.png">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "@id": "<%= htmlWebpackPlugin.options.siteOrigin %>/#app",
      "name": "Podr",
      "url": "<%= htmlWebpackPlugin.options.siteOrigin %>/",
      "description": "An open source podcast player for the web. Search podcasts, keep your favorites, and listen right in the browser.",
      "image": "<%= htmlWebpackPlugin.options.siteOrigin %>/og-image.png",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Any (web browser)",
      "browserRequirements": "Requires JavaScript",
      "isAccessibleForFree": true,
      "license": "https://opensource.org/licenses/MIT",
      "codeRepository": "https://github.com/cascadiacollections/podr",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Organization", "name": "Cascadia Collections", "url": "https://cascadiacollections.com/" }
    }
    </script>
    <link rel="manifest" href="/site.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <!-- Artwork comes from Apple's CDN; warming the connection saves a round trip on the first grid -->
    <link rel="preconnect" href="https://is1-ssl.mzstatic.com" crossorigin>
    <!-- Styles ship inside the bundle: no third-party stylesheet blocks the first paint -->
    <!--
      Analytics is injected at build time from PODR_ANALYTICS_PROVIDER and is
      empty unless a deployment opts in, so a default build loads no analytics
      script at all. See config/analytics.js and docs/SELF_HOSTING.md.
    -->
    <% if (htmlWebpackPlugin.options.analyticsProvider === 'gtag') { %>
    <!--
      Google Consent Mode v2. Must run before the gtag config in the analytics
      snippet below. In the EEA, the UK and Switzerland every storage type
      starts denied until the consent prompt records a choice, as the privacy
      policy promises; elsewhere storage is granted by default. wait_for_update
      holds the first tags back briefly so the prompt can apply a stored choice.
      Without a consent prompt (no publisher id) there is no way to grant
      consent, so storage stays denied everywhere instead.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      <% if (htmlWebpackPlugin.options.adsPublisherId) { %>
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500,
        region: [<%= htmlWebpackPlugin.options.consentRegions.map(function (r) { return JSON.stringify(r); }).join(', ') %>]
      });
      gtag('consent', 'default', {
        ad_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted',
        analytics_storage: 'granted'
      });
      <% } else { %>
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied'
      });
      <% } %>
    </script>
    <% } %>
    <% if (htmlWebpackPlugin.options.adsPublisherId) { %>
    <!--
      Google CMP (Funding Choices) consent prompt, enabled under AdSense >
      Privacy & messaging. It records the visitor's choice, updates Consent
      Mode, and offers the "Privacy and cookie settings" link the privacy policy
      points to. Loaded ahead of the analytics snippet.
    -->
    <script async src="https://fundingchoicesmessages.google.com/i/<%= htmlWebpackPlugin.options.adsPublisherId %>?ers=1"></script>    <% } %>
    <%= htmlWebpackPlugin.options.analyticsSnippet || '' %>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
